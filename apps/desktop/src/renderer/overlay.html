<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Time Machine overlay</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* The agent pill: ink at 70 percent with a slow breath. Never red, never green. */
  .ov-pill { display: flex; align-items: center; gap: 8px; margin: 4px auto; height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 70%, transparent); color: var(--paper); font: 500 12px/1 var(--font); white-space: nowrap; cursor: pointer; }
  .ov-pill .breath { width: 6px; height: 6px; border-radius: 50%; background: var(--paper); animation: tm-breath 2.4s ease-in-out infinite; }
  @keyframes tm-breath { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ov-pill .breath { animation: none; } }
</style>
</head>
<body class="overlay-body">
<div id="overlay"></div>
<script src="overlay.js"></script>
</body>
</html>
